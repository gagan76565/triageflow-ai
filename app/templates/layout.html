<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TriageFlow AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: white; }
    </style>
</head>
<body>
<nav class="bg-slate-900 border-b border-slate-700 px-4 py-4">
    <div class="max-w-7xl mx-auto flex flex-wrap gap-4 justify-between items-center">
        <a href="{{ url_for('main.home') }}" class="text-2xl font-bold text-cyan-400">
            TriageFlow AI
        </a>
        <div class="flex flex-wrap items-center gap-2 sm:gap-3">
            <a href="{{ url_for('main.bulk_upload') }}"
               class="bg-violet-600 hover:bg-violet-700 px-4 py-2 rounded-lg font-semibold">
                Bulk Analyze
            </a>
            <a href="{{ url_for('main.home') }}#new-ticket"
               class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg font-semibold">
                + New Ticket
            </a>
            <a href="{{ url_for('main.dashboard') }}"
               class="bg-cyan-500 hover:bg-cyan-600 px-4 py-2 rounded-lg font-semibold">
                Dashboard
            </a>
        </div>
    </div>
</nav>
<main class="max-w-7xl mx-auto p-6">
    {% block content %}{% endblock %}
</main>
</body>
</html>
